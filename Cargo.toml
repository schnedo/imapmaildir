[package]
name = "imapmaildir"
version = "0.2.0"
edition = "2024"
description = "Receive mail by syncing remote imap mailboxes with local maildir directories."
license = "GPL-3.0-or-later"
license-file = "LICENSE"
repository = "https://github.com/schnedo/imapmaildir"
keywords = ["idle", "mutt", "aerc"]
categories = ["command-line-utilities", "email"]
include = ["/src/**/*.rs", "/migrations/*", "/build.rs"]

[dependencies]
anstyle = "1.0.14"
anyhow = "1.0.104"
asynchronous-codec = "0.7.0"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"] }
compio = { version = "0.19.2", features = [
  "bytes",
  "fs",
  "macros",
  "time",
  "net",
  "native-tls",
  "process",
] }
crossfire = "3.1.21"
derive-getters = { version = "0.5.0", features = ["auto_copy_getters"] }
derive_builder = "0.20.2"
enumflags2 = { version = "0.7.12", features = ["serde"] }
env_logger = "0.11.11"
futures = "0.3.34"
futures-util = "0.3.34"
humantime-serde = "1.1.1"
imap-proto = "0.17.0"
include_dir = "0.7.4"
inotify = { version = "0.11.5", default-features = false }
jiff = "0.2.38"
log = { version = "0.4.34", features = [
  "kv",
  "release_max_level_debug",
  "std",
] }
nom = "8"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rusqlite_migration = { version = "2.6.0", features = ["from-directory"] }
rustix = { version = "1.1.5", features = [
  "fs",
  "net",
  "std",
  "system",
], default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
toml = "1.1.8"

[lints.clippy]
pedantic = { level = "warn", priority = -2 }
allow_attributes = "warn"

[dev-dependencies]
assertables = "=10.1.0"
derivative = "=2.2.0"
rstest = "=0.28.0"
tempfile = "=3.27.0"
testcontainers = { version = "=0.28.0", features = ["blocking"] }

[profile.release]
lto = "fat"
codegen-units = 1
