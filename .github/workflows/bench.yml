---
name: Benchmarks

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "compare against base or calibrate thresholds"
        type: choice
        options:
          - compare
          - calibrate
        default: compare
      base:
        description: "Base ref to compare against (compare)"
        default: main
      runs:
        description: "Number of A/A comparisons (calibrate)"
        default: "5"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"
  SKIP_SHELL_HOOK: 1

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: "${{ vars.CACHIX_CACHE }}"
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      - name: cache cargo packages
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cmd-format: nix develop -c {0}
      - name: Compare benchmarks against base
        if: inputs.mode == 'compare'
        run: nix develop -c bench-compare --profile ci "origin/${BASE}"
        env:
          BASE: ${{ inputs.base }}
      - name: Calibrate thresholds
        if: inputs.mode == 'calibrate'
        run: nix develop -c bench-calibrate "${RUNS}"
        env:
          RUNS: ${{ inputs.runs }}
      - name: Upload criterion reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: criterion
          path: target/criterion
