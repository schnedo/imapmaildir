---
name: Rust

on:
  pull_request:
    branches:
      - "main"

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"
  SKIP_SHELL_HOOK: 1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: "${{ vars.CACHIX_CACHE }}"
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      - name: cache cargo packages
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cmd-format: nix develop -c {0}
      - name: Build
        run: nix develop -c cargo build --verbose
      - name: Run tests
        # todo: have a look at criterion.rs
        # todo: have a look at cargo mutants
        run: nix develop -c cargo nextest run --profile ci
      - name: Lint
        run: nix develop -c cargo clippy --all-targets --all-features
