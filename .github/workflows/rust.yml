---
name: Rust

on:
  pull_request:
    branches:
      - "main"
  # push to main only warms the rust-cache for PRs (test steps skipped)
  push:
    branches:
      - "main"

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"
  SKIP_SHELL_HOOK: 1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: "${{ vars.CACHIX_CACHE }}"
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      - name: cache cargo packages
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          cmd-format: nix develop -c {0}
      - name: Build
        run: nix develop -c cargo build --verbose
      - name: Build tests (cache warm-up)
        if: github.event_name == 'push'
        run: nix develop -c cargo nextest run --profile ci --no-run
      - name: Run tests
        if: github.event_name == 'pull_request'
        # todo: have a look at cargo mutants
        run: nix develop -c cargo nextest run --profile ci
      - name: Run integration tests without QRESYNC
        if: github.event_name == 'pull_request'
        run: nix develop -c cargo nextest run --profile ci --test once --test continuous
        env:
          IMAPMAILDIR_TEST_NO_QRESYNC: 1
      - name: Run integration tests with LITERAL-
        if: github.event_name == 'pull_request'
        run: nix develop -c cargo nextest run --profile ci --test once --test continuous
        env:
          IMAPMAILDIR_TEST_LITERAL_MINUS: 1
      - name: Run OAuth2 integration tests with XOAUTH2 without SASL-IR
        if: github.event_name == 'pull_request'
        run: nix develop -c cargo nextest run --profile ci --test once oauth2
        env:
          IMAPMAILDIR_TEST_XOAUTH2: 1
      - name: Lint
        run: nix develop -c cargo clippy --all-targets --all-features

